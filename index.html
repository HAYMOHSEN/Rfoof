<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rfoof</title>
  <meta name="description" content="Rfoof – organize your documents, photos and files in colorful folders. Works offline, searches inside files, backs up to any folder or cloud drive. English & Arabic.">
  <meta name="theme-color" content="#f3f3f3">
  <meta name="color-scheme" content="light dark">
  <meta name="application-name" content="Rfoof">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rfoof">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./css/app.css">
  <script>
    // Apply saved theme/language before first paint to avoid flashes
    (function () {
      try {
        var l = localStorage.getItem('rfoof.lang') || ((navigator.language || 'en').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en');
        document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
        var th = localStorage.getItem('rfoof.theme');
        var dark = th === 'dark' || (th !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
      // Keep the browser's "install app" offer until the app is ready to show its own Install button
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__rfoofInstallPrompt = e; }, { once: true });
    })();
  </script>
</head>
<body>
  <noscript>Rfoof needs JavaScript to run. / يحتاج تطبيق رفوف إلى تفعيل JavaScript.</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
